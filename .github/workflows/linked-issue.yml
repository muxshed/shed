name: Linked issue

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  check:
    name: Linked issue
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Require an issue reference in the PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|relates to) +(#|https://github\.com/muxshed/shed/issues/)[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::Link an issue in the PR body, e.g. 'Fixes #123'. Open one first if none exists."
            exit 1
          fi
